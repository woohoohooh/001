{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/main2.css' %}">
    <meta name="description" content="{% block description %}Каталог компаний Engil.ru: отзывы, контактная информация, услуги.{% endblock %}">
    <meta name="keywords" content="{% block keywords %}engil, engil.ru, каталог компаний, отзывы о компаниях{% endblock %}">
    <title>{% block title %}Каталог компаний{% endblock %}</title>

    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
</head>
<body>
<div class="container">
    <div class="row">
        <div><br>
            <a href="{% url 'index' %}"><img src="{% static 'img/logo.png' %}" alt="Logo" width="111"></a>
            <nav><br>
                    <big>
                        <div class="dropdown">
                        </div>
                    </big>
            </nav>
        </div>
    </div>
</div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>

<style>
    #centeredElement {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: #3498db;
        color: white;
        padding: 20px;
        cursor: pointer;
        border-radius: 50%;
        transition: all 0.3s ease;
        user-select: none; /* Запрещаем выделение текста */
    }
</style>
<div id="centeredElement">Кликни меня!</div>
<script>
    var centeredElement = document.getElementById('centeredElement');
    centeredElement.addEventListener('click', function() {
        var newSize = Math.floor(Math.random() * 200) + 100;
        var newColor = '#' + Math.floor(Math.random()*16777215).toString(16);
        centeredElement.style.width = newSize + 'px';
        centeredElement.style.height = newSize + 'px';
        centeredElement.style.backgroundColor = newColor;
    });
</script>

</body>
</html>
