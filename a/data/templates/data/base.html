{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="{% block description %}Смотрите отзывы о компаниях: отзывы, контактная информация, услуги и многое другое.{% endblock %}">
    <meta name="keywords" content="{% block keywords %}engil.ru, отзывы о компаниях, контакты компаний{% endblock %}">

    <title>{% block title %}Отзывы о компаниях{% endblock %}</title>

    <link rel="stylesheet" type="text/css" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/main2.css' %}">
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
</head>
<body>
    {% include 'data/menu.html' %}
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
