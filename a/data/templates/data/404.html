<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        h1 {
            font-size: 48px;
            color: #e74c3c;
        }
        p {
            font-size: 18px;
            color: #666;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        .error-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">😕</div>
        <h1>Упс! Страница не найдена.</h1>
        <p>К сожалению, страница, которую вы искали, не существует.</p>
        <p>Возможно, она была удалена, или вы допустили ошибку в URL.</p>
        <p>
            <a href="/">Вернуться на главную</a> или попробуйте перейти по ссылкам ниже:
        </p>
        <ul>
            <li><a href="/about">О нас</a></li>
            <li><a href="/contact">Контакты</a></li>
            <li><a href="/blog">Блог</a></li>
        </ul>
    </div>
</body>
</html>
